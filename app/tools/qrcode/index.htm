<!DOCTYPE html>
<html>
<head>
<style>
body table{font-size: 12px;padding:20px;}
input{
height:32px;line-height:32px;width:320px;padding:0 8px;font-size:14px;
border-right:#add2cc 1px solid;border-top:#add2cc 1px solid;border-left:#add2cc 1px solid;border-bottom:#add2cc 1px solid}

display:block;
height:0;

}

<script src="../../../inc/js/jquery.js"></script>
<script src="../../../inc/js/common.js"></script>
<script src="../../share/jquery.qrcode.min.js"></script>
</head>
<body>
<script language="JavaScript">
var size = 200;

function toUtf8(str) {
	var out, i, len, c;
	out = "";
	len = str.length;
	for(i = 0; i < len; i++) {
	c = str.charCodeAt(i);
	if ((c >= 0x0001) && (c <= 0x007F)) {
		out += str.charAt(i);
	} else if (c > 0x07FF) {
		out += String.fromCharCode(0xE0 | ((c >> 12) & 0x0F));
		out += String.fromCharCode(0x80 | ((c >>  6) & 0x3F));
		out += String.fromCharCode(0x80 | ((c >>  0) & 0x3F));
	} else {
		out += String.fromCharCode(0xC0 | ((c >>  6) & 0x1F));
		out += String.fromCharCode(0x80 | ((c >>  0) & 0x3F));
	}
	}
	return out;
}

function getcode()
{
	if($("#code").val().length>512)
	{
		alert("过长，不能超过512字");
		return false;
	}
	var str = toUtf8($("#code").val());
	var win = window.parent||window;
				win.layer_view("二维码生成结果",this,size+120,'','anc_delbody',"HTML:<table style='margin:16px 0;width:100%;text-align:left;'><tr><td align=center valign=middle><span id=ldshare_wenxin></span><br><br>打开微信，点击底部的发现，使用<br>扫一扫即可将内容分享至朋友圈。</td></tr></table>","",1,"",1,0,"setCenterDiv($('#anc_delbody'))");
				if(Browser.is_ie_lower||Browser.ie9)
				$('#ldshare_wenxin', win.document).qrcode({
					render: "table", 
					width: size, 
					height:size, 
					text: str
				});
				else
				$('#ldshare_wenxin', win.document).qrcode({
					width: size, 
					height:size, 
					text: str
				});
				return false;
}


function codesize(s,obj)
{
	size = s;
	$(".qrcode_size_sel").attr("class","qrcode_size");
	$(obj).attr("class","qrcode_size_sel")
}
</script>

	<script languange="Javascript" src="Convert.js"></script>
	<p>请输入要生成二维码的内容（比如网址，或其它内容）
	</p>
	<p>
	<textarea type=input id=code name=code></textarea>
	</p>
	<a href=# onclick="codesize(200,this)" class="qrcode_size_sel">生成大小: 200</a>
	<a href=# onclick="codesize(400,this)" class="qrcode_size">400</a>
	<a href=# onclick="codesize(800,this)" class="qrcode_size">800</a>
	
	<a href=# onclick="getcode()" id="getcode">生成二维码</a>
</body>
</html>
